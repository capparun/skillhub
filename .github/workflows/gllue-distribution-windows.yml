name: Gllue distribution Windows acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/gllue-windows-acceptance', 'codex/gllue-opencli202-upgrade']
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    env:
      GLLUE_RELEASE_MANIFEST: candidate-artifacts/gllue-only-v1.3.1.json
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Minimal directory relocation probe
        run: node scripts/gllue-directory-probe.mjs
      - run: npm ci
      - name: Build current candidate
        run: node scripts/build-gllue-release.mjs --preview-out candidate-artifacts
      - name: Official bootstrap in Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        env:
          PUBLIC_APP_URL: http://127.0.0.1:18764
        run: ./scripts/verify-gllue-windows.ps1
      - name: Official bootstrap in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          PUBLIC_APP_URL: http://127.0.0.1:18764
        run: ./scripts/verify-gllue-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gllue-windows-${{ matrix.shell }}-logs
          path: |
            fixture*.log
            ${{ runner.temp }}/hunter-install-log-*/*.txt
          retention-days: 7
