name: Gllue official-site candidate acceptance
on:
  push:
    branches: ['codex/gllue-online-install-20261031']
    paths: ['.github/workflows/gllue-online-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-install:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/gllue-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows lifecycle faults and rollback
        shell: pwsh
        run: |
          node --test tools/gllue-delivery/test/lifecycle.test.mjs | Tee-Object -FilePath "$env:RUNNER_TEMP/gllue-unit.tap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 5.1 official site acceptance
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gllue-online-smoke.mjs'
          Invoke-WebRequest -UseBasicParsing 'https://hunterskill.zeabur.app/download/testing/gllue-rc6-online-smoke.mjs' -OutFile $probe
          $expected = 'e0761f686ca1900c9af12c7dec6d54d28a7b2b847fe0613e1f354f77b8601edf'
          if ((Get-FileHash $probe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Probe SHA mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'gllue-online-${{ matrix.shell }}'
          node $probe $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 official site acceptance
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gllue-online-smoke.mjs'
          Invoke-WebRequest -UseBasicParsing 'https://hunterskill.zeabur.app/download/testing/gllue-rc6-online-smoke.mjs' -OutFile $probe
          $expected = 'e0761f686ca1900c9af12c7dec6d54d28a7b2b847fe0613e1f354f77b8601edf'
          if ((Get-FileHash $probe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Probe SHA mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'gllue-online-${{ matrix.shell }}'
          node $probe $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect failed staging without modifying installation
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'gllue-online-${{ matrix.shell }}'
          Get-ChildItem $root -Recurse -Filter distribution.json | ForEach-Object {
            Write-Output $_.FullName
            try { $m = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json; Write-Output $m.version } catch { Write-Output $_ }
          }
          Get-ChildItem $root -Directory | ForEach-Object { Write-Output $_.FullName }
          where.exe tar
          Get-ChildItem $root -Recurse -Filter package.tar.gz | ForEach-Object {
            Write-Output "Full Unicode path: $($_.FullName)"
            $listing = & tar -tzf $_.FullName 2>&1
            $listing | Select-Object -First 5
            Write-Output "fullPathExit=$LASTEXITCODE"
            Push-Location $_.DirectoryName
            $listing = & tar -tzf package.tar.gz 2>&1
            $listing | Select-Object -First 5
            Write-Output "relativeExit=$LASTEXITCODE"
            Pop-Location
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gllue-online-${{ matrix.shell }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gllue-unit.tap
            ${{ runner.temp }}/gllue-online-*/report.json
            ${{ runner.temp }}/gllue-online-*/commands.jsonl
            ${{ runner.temp }}/gllue-online-*/guard-loaded.log
            ${{ runner.temp }}/gllue-online-*/**/logs/*.jsonl
