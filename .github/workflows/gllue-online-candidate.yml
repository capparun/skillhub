name: Gllue official-site candidate acceptance
on:
  push:
    branches: ['codex/gllue-online-install-20261031']
    paths: ['.github/workflows/gllue-online-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-install:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PowerShell 5.1 official site acceptance
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gllue-online-smoke.mjs'
          Invoke-WebRequest -UseBasicParsing 'https://hunterskill.zeabur.app/download/testing/gllue-rc4-online-smoke.mjs' -OutFile $probe
          $expected = '6d6f2d21a78c3e58c2f36e0cf843add44d5ced4a94c486803a83587d4ba1593f'
          if ((Get-FileHash $probe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Probe SHA mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'gllue-online-${{ matrix.shell }}'
          node $probe $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 official site acceptance
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gllue-online-smoke.mjs'
          Invoke-WebRequest -UseBasicParsing 'https://hunterskill.zeabur.app/download/testing/gllue-rc4-online-smoke.mjs' -OutFile $probe
          $expected = '6d6f2d21a78c3e58c2f36e0cf843add44d5ced4a94c486803a83587d4ba1593f'
          if ((Get-FileHash $probe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Probe SHA mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'gllue-online-${{ matrix.shell }}'
          node $probe $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gllue-online-${{ matrix.shell }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gllue-online-*/report.json
            ${{ runner.temp }}/gllue-online-*/commands.jsonl
            ${{ runner.temp }}/gllue-online-*/guard-loaded.log
            ${{ runner.temp }}/gllue-online-*/**/logs/*.jsonl
