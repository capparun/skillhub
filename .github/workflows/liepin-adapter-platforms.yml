name: Liepin Adapter platform acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/liepin-ci-acceptance]
    paths:
      - '.github/workflows/liepin-adapter-platforms.yml'
      - 'distribution/liepin-search/**'
      - 'tools/liepin-mcp/**'
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        # ARM64 hosted capacity exhausted in run 39462777443; local ARM64
        # acceptance is recorded separately. Keep cloud macOS coverage on Intel.
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent source, core and adapter regression
        run: node tools/liepin-mcp/scripts/verify-source-delivery.mjs source-delivery-result.json
      - name: Real isolated package installation
        run: node tools/liepin-mcp/scripts/verify-platform-install.mjs adapter-platform-result.json 0.3.0
      - name: Windows failure diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $since = (Get-Date).AddMinutes(-10)
          $crashes = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$since} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') -and $_.Message -match 'node.exe' } | Select-Object -First 5 TimeCreated, Id, ProviderName, Message)
          $defender = @(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; StartTime=$since; Id=1116,1117} -ErrorAction SilentlyContinue | Select-Object -First 5 TimeCreated, Id, Message)
          @{nodeCrashes=$crashes; defenderDetections=$defender} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 windows-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liepin-adapter-${{ matrix.os }}
          path: |
            adapter-platform-result.json
            source-delivery-result.json
            windows-diagnostics.json
          retention-days: 7
